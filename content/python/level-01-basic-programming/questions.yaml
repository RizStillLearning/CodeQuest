- id: python-l1-q01
  type: multiple_choice
  prompt: Dalam urutan apa Python menjalankan baris-baris program?
  options:
    - "Dari atas ke bawah, satu baris setiap kali"
    - "Dari bawah ke atas"
    - "Semua baris sekaligus"
    - "Dalam urutan acak"
  answer: "Dari atas ke bawah, satu baris setiap kali"
  explanation: >-
    Python mulai dari baris pertama dan menjalankan setiap baris secara berurutan sampai selesai.
  xp: 5

- id: python-l1-q02
  type: predict_output
  prompt: Apa output dari kode ini?
  code: |
    print("Halo")
    # print("Dadah")
    print("CodeQuest")
  answer: |-
    Halo
    CodeQuest
  explanation: >-
    Baris yang diawali # adalah komentar, jadi Python melewatinya. Hanya dua baris lainnya yang ditampilkan.
  xp: 10

- id: python-l1-q03
  type: fill_in
  prompt: Lengkapi kode agar menampilkan Selamat datang! di layar.
  code: |
    ____("Selamat datang!")
  answer: "print"
  explanation: >-
    print() menampilkan apa pun yang ada di dalam tanda kurung ke layar.
  xp: 10

- id: python-l1-q04
  type: predict_output
  prompt: Apa output dari kode ini?
  code: |
    xp = 50
    xp = xp + 10
    xp = xp + 5
    print(xp)
  answer: "65"
  explanation: >-
    xp dimulai dari 50, menjadi 60, lalu 65. Setiap baris memakai nilai saat ini untuk menghitung nilai barunya.
