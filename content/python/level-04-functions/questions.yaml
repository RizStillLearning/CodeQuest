- id: python-l4-q10
  type: case_study
  scenario: |-
    Budi membuat fungsi untuk menghitung XP bonus dari streak, lalu menjumlahkannya dengan
    XP pengguna. Programnya menampilkan 15, lalu muncul error
    TypeError: unsupported operand type(s) for +: 'int' and 'NoneType', dan program berhenti.
  code: |
    def bonus_xp(streak):
        print(streak * 5)

    total = 100 + bonus_xp(3)
    print(total)
  prompt: Bagaimana cara memperbaikinya?
  options:
    - "Ganti print(streak * 5) menjadi return streak * 5"
    - 'Ganti bonus_xp(3) menjadi bonus_xp("3")'
    - "Tukar urutannya menjadi total = bonus_xp(3) + 100"
    - "Tambahkan print(bonus_xp(3)) sebelum baris total"
  answer: "Ganti print(streak * 5) menjadi return streak * 5"
  explanation: >-
    bonus_xp hanya menampilkan 15 dengan print, tetapi tidak mengembalikan apa-apa, jadi
    hasilnya None. 100 + None menyebabkan error. Dengan return, fungsi mengembalikan 15 dan
    total menjadi 115. Opsi lainnya tetap menjumlahkan angka dengan None.
  xp: 15
