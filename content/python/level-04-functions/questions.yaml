- id: python-l4-q01
  type: multiple_choice
  prompt: Kapan kode di dalam sebuah fungsi dijalankan?
  options:
    - "Saat fungsinya dipanggil"
    - "Saat fungsinya dibuat dengan def"
    - "Otomatis setiap kali program dimulai"
    - "Hanya jika fungsinya punya return"
  answer: "Saat fungsinya dipanggil"
  explanation: >-
    def hanya membuat fungsi. Isinya baru dijalankan saat fungsinya dipanggil, misalnya
    dengan greet(), dan dijalankan lagi setiap kali dipanggil.
  xp: 5

- id: python-l4-q02
  type: predict_output
  prompt: Apa output dari kode ini?
  code: |
    def greet():
        print("Halo")

    print("A")
    greet()
    greet()
    print("B")
  answer: |-
    A
    Halo
    Halo
    B
  explanation: >-
    Python menampilkan A, lalu menjalankan isi greet() dua kali, lalu menampilkan B.
    Membuat fungsi dengan def tidak menampilkan apa-apa.
  xp: 10

- id: python-l4-q03
  type: fill_in
  prompt: Lengkapi kode agar fungsi mengembalikan hasil perkalian a dan b.
  code: |
    def multiply(a, b):
        ____ a * b

    print(multiply(3, 4))
  answer: "return"
  explanation: >-
    return mengirim hasil a * b kembali ke tempat fungsi dipanggil, jadi kode menampilkan 12.
  xp: 10

- id: python-l4-q04
  type: predict_output
  prompt: Apa output dari kode ini?
  code: |
    def add_xp(xp, bonus):
        return xp + bonus

    print(add_xp(30, 5) + add_xp(10, 5))
  answer: "50"
  explanation: >-
    add_xp(30, 5) mengembalikan 35 dan add_xp(10, 5) mengembalikan 15. Hasil dari fungsi bisa
    langsung dipakai untuk menghitung, jadi 35 + 15 = 50.
  xp: 10

