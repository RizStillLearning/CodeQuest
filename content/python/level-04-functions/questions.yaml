- id: python-l4-q06
  type: predict_output
  prompt: Apa output dari kode ini?
  code: |
    def get_grade(score):
        if score >= 80:
            return "A"
        return "B"
        print("C")

    print(get_grade(90))
    print(get_grade(50))
  answer: |-
    A
    B
  explanation: >-
    return langsung menghentikan fungsi. Untuk 90, fungsi berhenti di return "A". Untuk 50,
    fungsi berhenti di return "B". Baris print("C") tidak pernah dijalankan.
  xp: 10

