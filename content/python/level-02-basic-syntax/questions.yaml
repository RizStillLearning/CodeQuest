- id: python-l2-q01
  type: predict_output
  prompt: Apa output dari kode ini?
  code: |
    print(7 // 2)
    print(7 % 2)
  answer: |-
    3
    1
  explanation: >-
    // membagi lalu membulatkan ke bawah, jadi 7 // 2 = 3. % memberi sisa bagi:
    7 dibagi 2 adalah 3 sisa 1, jadi 7 % 2 = 1.
