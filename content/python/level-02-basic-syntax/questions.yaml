- id: python-l2-q05
  type: predict_output
  prompt: Apa output dari kode ini?
  code: |
    xp = 150
    if xp >= 200:
        print("Level 3")
    elif xp >= 100:
        print("Level 2")
    else:
        print("Level 1")
  answer: "Level 2"
  explanation: >-
    xp >= 200 bernilai False, jadi Python lanjut ke elif. xp >= 100 bernilai True,
    jadi Level 2 ditampilkan dan bagian else dilewati.
  xp: 10

- id: python-l2-q06
  type: multiple_choice
  prompt: Apa perbedaan = dan == di Python?
  options:
    - "= menyimpan nilai, == membandingkan dua nilai"
    - "Keduanya sama saja"
    - "= membandingkan dua nilai, == menyimpan nilai"
    - "== hanya bisa dipakai untuk teks"
  answer: "= menyimpan nilai, == membandingkan dua nilai"
  explanation: >-
    xp = 10 menyimpan 10 ke dalam xp. xp == 10 memeriksa apakah xp sama dengan 10,
    dan hasilnya True atau False.
  xp: 5

