- id: python-l2-q10
  type: case_study
  scenario: |-
    Budi membuat fitur lencana. Pengguna dengan XP 250 seharusnya mendapat lencana Emas,
    tetapi kode ini malah menampilkan Perak.
  code: |
    xp = 250
    if xp >= 100:
        print("Perak")
    elif xp >= 200:
        print("Emas")
    else:
        print("Perunggu")
  prompt: Bagaimana cara memperbaikinya?
  options:
    - "Periksa xp >= 200 lebih dulu, baru xp >= 100"
    - "Ganti elif menjadi if"
    - "Ganti semua >= menjadi =="
    - "Hapus bagian else"
  answer: "Periksa xp >= 200 lebih dulu, baru xp >= 100"
  explanation: >-
    Python berhenti di kondisi pertama yang True. 250 >= 100 sudah True, jadi Perak
    ditampilkan dan elif tidak pernah diperiksa. Periksa kondisi yang paling ketat lebih dulu.
    Mengganti elif menjadi if akan menampilkan Perak dan Emas sekaligus, mengganti >= menjadi ==
    akan menampilkan Perunggu, dan menghapus else tidak mengubah apa-apa.
  xp: 15
