  prompt: Lengkapi kode agar menampilkan Selamat datang! lalu pindah ke baris baru.
  code: |
    System.out.____("Selamat datang!");
  answer: "println"
  explanation: >-
    System.out.println() menampilkan teks, lalu pindah ke baris baru.
  xp: 10

- id: java-l1-q04
  type: predict_output
  prompt: Apa output dari kode ini?
  code: |
    int xp = 50;
    xp = xp + 10;
    xp = xp + 5;
    System.out.println(xp);
  answer: "65"
  explanation: >-
    xp dimulai dari 50, menjadi 60, lalu 65. Setiap baris memakai nilai saat ini untuk menghitung nilai barunya.
  xp: 10

- id: java-l1-q05
  type: multiple_choice
  prompt: Baris mana yang menyebabkan error?
  options:
    - 'int age = 20;'
    - 'String name = "Budi";'
    - 'int score = "90";'
    - 'double price = 2.5;'
  answer: 'int score = "90";'
  explanation: >-
    Variabel int hanya bisa menyimpan bilangan bulat. "90" diapit tanda kutip, jadi nilainya teks (String), bukan int.
  xp: 5

- id: java-l1-q06
  type: predict_output
  prompt: Apa output dari kode ini?
  code: |
    System.out.println(7 / 2);
  answer: "3"
  explanation: >-
    7 dan 2 sama-sama int, jadi Java melakukan pembagian bilangan bulat dan membuang bagian desimalnya. 3.5 menjadi 3.
  xp: 10

- id: java-l1-q07
  type: multiple_choice
  prompt: Tipe apa yang sebaiknya dipakai untuk menyimpan tinggi badan seperti 1.75?
  options:
    - "int"
    - "double"
    - "String"
    - "boolean"
  answer: "double"
  explanation: >-
    1.75 punya titik desimal, jadi butuh double. int hanya bisa menyimpan bilangan bulat.
  xp: 5

