- id: java-l1-q09
  type: predict_output
  prompt: Apa output dari kode ini?
  code: |
    String a = "5";
    int b = 5;
    System.out.println(a + b);
  answer: "55"
  explanation: >-
    a adalah String, jadi + menyambung kedua nilai sebagai teks, bukan menjumlahkannya. "5" dan 5 menjadi "55".
  xp: 10

- id: java-l1-q10
  type: case_study
  scenario: |-
    Dimas sedang membuat aplikasi kuis. Skor pengguna disimpan sebagai teks:
    String score = "80";
    Ia ingin menambahkan 10 poin bonus dan menampilkan 90.
  prompt: Baris mana yang menampilkan 90?
  options:
    - 'System.out.println(score + 10);'
    - 'System.out.println(Integer.parseInt(score) + 10);'
    - 'System.out.println((int) score + 10);'
    - 'System.out.println(Integer.parseInt(score + 10));'
  answer: 'System.out.println(Integer.parseInt(score) + 10);'
  explanation: >-
    Integer.parseInt(score) mengubah teks "80" menjadi angka 80, jadi 80 + 10 = 90.
    score + 10 menyambung teksnya menjadi "8010". (int) tidak bisa mengubah String, jadi
    menyebabkan error. Opsi terakhir menyambung teksnya dulu, jadi yang diubah adalah
    "8010" dan hasilnya 8010.
  xp: 15
