- id: java-l1-q01
  type: multiple_choice
  prompt: Simbol apa yang mengakhiri setiap perintah di Java?
  options:
    - ";"
    - "."
    - ":"
    - "}"
  answer: ";"
  explanation: >-
    Setiap perintah Java diakhiri titik koma (;). Lupa menulisnya adalah salah satu error yang paling sering dialami pemula.
  xp: 5

- id: java-l1-q02
  type: predict_output
  prompt: Apa output dari kode ini?
  code: |
    System.out.print("Code");
    System.out.println("Quest");
    System.out.println("!");
  answer: |-
    CodeQuest
    !
  explanation: >-
    print tetap di baris yang sama, jadi "Quest" langsung ditampilkan setelah "Code".
    println lalu pindah ke baris baru sebelum "!".
  xp: 10

- id: java-l1-q03
