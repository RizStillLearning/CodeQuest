- id: java-l3-q01
  type: multiple_choice
  prompt: Method Scanner mana yang dipakai untuk membaca bilangan bulat?
  options:
    - "nextInt()"
    - "nextLine()"
    - "nextDouble()"
    - "nextBoolean()"
  answer: "nextInt()"
  explanation: >-
    nextInt() membaca bilangan bulat (int). nextLine() membaca satu baris teks, dan
    nextDouble() membaca bilangan desimal.
  xp: 5

- id: java-l3-q02
  type: predict_output
  prompt: Jika pengguna mengetik 7, apa output dari kode ini?
  input: "7"
  code: |
    Scanner input = new Scanner(System.in);
    int number = input.nextInt();
    System.out.println(number * 2);
  answer: "14"
  explanation: >-
    nextInt() membaca angka 7 sebagai int, jadi number * 2 = 14.
  xp: 10

- id: java-l3-q03
  type: predict_output
  prompt: Apa output dari kode ini?
  code: |
    int age = 20;
    System.out.println("Umur: " + age + 1);
  answer: "Umur: 201"
  explanation: >-
    Java membaca + dari kiri ke kanan. "Umur: " + age menjadi teks "Umur: 20", lalu
    + 1 menyambung angka 1 di belakangnya. Tulis ("Umur: " + (age + 1)) untuk mendapat 21.
  xp: 10

- id: java-l3-q04
  type: fill_in
  prompt: Lengkapi kode agar Scanner membaca input dari keyboard.
  code: |
    Scanner input = new Scanner(____);
  answer: "System.in"
  explanation: >-
    System.in adalah input dari keyboard. Scanner membaca apa pun yang diketik pengguna dari sana.
  xp: 10

- id: java-l3-q05
  type: predict_output
  prompt: Apa output dari kode ini?
  code: |
    int score = 65;
    boolean finished = true;
    if (finished) {
        if (score >= 80) {
            System.out.println("A");
        } else {
            System.out.println("B");
        }
    } else {
        System.out.println("Belum selesai");
    }
  answer: "B"
  explanation: >-
    finished bernilai true, jadi if bagian dalam diperiksa. score >= 80 bernilai false,
    jadi else bagian dalam dijalankan dan B ditampilkan.
  xp: 10

- id: java-l3-q06
  type: multiple_choice
  prompt: Berapa kali println di dalam perulangan ini dijalankan?
  code: |
    for (int i = 0; i < 2; i++) {
        for (int j = 0; j < 3; j++) {
            System.out.println("*");
        }
    }
  options:
    - "2 kali"
    - "3 kali"
    - "5 kali"
    - "6 kali"
  answer: "6 kali"
  explanation: >-
    Perulangan luar berjalan 2 kali. Di setiap putarannya, perulangan dalam berjalan 3 kali.
    Jadi totalnya 2 × 3 = 6 kali.
  xp: 5

- id: java-l3-q07
  type: predict_output
  prompt: Apa output dari kode ini?
  code: |
    for (int i = 1; i <= 5; i++) {
        if (i % 2 == 0) {
            continue;
        }
        System.out.println(i);
    }
  answer: |-
    1
    3
    5
  explanation: >-
    Saat i genap (2 dan 4), continue melompati println dan lanjut ke putaran berikutnya.
    Jadi yang ditampilkan hanya angka ganjil: 1, 3, dan 5.
  xp: 10

- id: java-l3-q08
  type: multiple_choice
  prompt: Apa perbedaan break dan continue?
  options:
    - "break menghentikan perulangan, continue melompati sisa putaran ini"
    - "break melompati sisa putaran ini, continue menghentikan perulangan"
    - "Keduanya menghentikan seluruh program"
    - "Keduanya hanya bisa dipakai di dalam while"
  answer: "break menghentikan perulangan, continue melompati sisa putaran ini"
  explanation: >-
    break keluar dari perulangan sepenuhnya. continue hanya melewati sisa putaran saat ini,
    lalu perulangan lanjut ke putaran berikutnya. Keduanya bisa dipakai di for dan while.
  xp: 5

- id: java-l3-q09
  type: fill_in
  prompt: Lengkapi kode agar pertanyaan berhenti diulang setelah jawabannya benar.
  code: |
    Scanner input = new Scanner(System.in);
    while (true) {
        int answer = input.nextInt();
        if (answer == 9) {
            System.out.println("Benar!");
            ____;
        }
    }
  answer: "break"
  explanation: >-
    while (true) berulang terus. break; menghentikan perulangan setelah jawabannya benar.
  xp: 10

- id: java-l3-q10
  type: case_study
  scenario: |-
    Andi membuat form pendaftaran kuis yang menanyakan umur, lalu nama. Tetapi setelah
    Andi mengetik umur dan menekan Enter, program langsung selesai tanpa menunggu nama diketik.
  code: |
    Scanner input = new Scanner(System.in);
    System.out.print("Umur: ");
    int age = input.nextInt();
    System.out.print("Nama: ");
    String name = input.nextLine();
    System.out.println("Halo, " + name + " (" + age + ")");
  prompt: Bagaimana cara memperbaikinya?
  options:
    - "Tambahkan input.nextLine(); tepat setelah input.nextInt();"
    - "Ganti input.nextLine() menjadi input.nextInt()"
    - 'Hapus baris System.out.print("Nama: ");'
    - "Ganti int age menjadi double age, dan nextInt() menjadi nextDouble()"
  answer: "Tambahkan input.nextLine(); tepat setelah input.nextInt();"
  explanation: >-
    nextInt() hanya membaca angkanya, sedangkan Enter setelahnya masih tersisa. nextLine()
    langsung membaca sisa Enter itu sebagai baris kosong, jadi name kosong. Memanggil
    input.nextLine(); sekali setelah nextInt() membuang Enter tersebut. nextInt() tidak bisa
    disimpan ke String, dan dua opsi lainnya tetap menyisakan Enter.
  xp: 15
