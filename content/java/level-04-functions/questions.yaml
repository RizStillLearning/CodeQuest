- id: java-l4-q10
  type: case_study
  scenario: |-
    Siti menulis method untuk menentukan nilai huruf. Menurutnya, ketiga kondisi sudah
    mencakup semua skor. Tetapi programnya tidak bisa di-compile, dan muncul error
    missing return statement.
  code: |
    static String getGrade(int score) {
        if (score >= 80) {
            return "A";
        } else if (score >= 60) {
            return "B";
        } else if (score < 60) {
            return "C";
        }
    }
  prompt: Bagaimana cara memperbaikinya?
  options:
    - "Ganti else if (score < 60) menjadi else"
    - "Ganti return type String menjadi void"
    - "Tambahkan else if (score >= 0) di bagian akhir"
    - "Hapus semua kata return"
  answer: "Ganti else if (score < 60) menjadi else"
  explanation: >-
    Java tidak memeriksa apakah ketiga kondisi sudah mencakup semua angka. Java hanya melihat
    bahwa jika ketiganya salah, tidak ada nilai yang dikembalikan. Dengan else, setiap jalur
    pasti berakhir dengan return. Menambah else if lagi tetap menyisakan jalur tanpa return.
    Dengan void, return "A" menjadi error karena method void tidak boleh mengembalikan nilai,
    dan tanpa kata return, baris seperti "A"; bukan perintah yang valid.
  xp: 15
