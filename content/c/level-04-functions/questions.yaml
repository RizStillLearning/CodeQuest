- id: c-l4-q10
  type: case_study
  scenario: |-
    Andi membuat fungsi untuk menambah 10 XP bonus. Ia memanggil fungsinya, tetapi XP yang
    ditampilkan tetap 50, bukan 60.
  code: |
    void add_bonus(int xp) {
        xp = xp + 10;
    }

    int main(void) {
        int my_xp = 50;
        add_bonus(my_xp);
        printf("%d\n", my_xp);
        return 0;
    }
  prompt: Bagaimana cara memperbaikinya?
  options:
    - "Ubah fungsinya menjadi int add_bonus(int xp) { return xp + 10; }, lalu tulis my_xp = add_bonus(my_xp);"
    - "Ganti nama parameter xp menjadi my_xp"
    - "Panggil add_bonus(my_xp); dua kali"
    - 'Tambahkan printf("%d\n", xp); di dalam add_bonus'
  answer: "Ubah fungsinya menjadi int add_bonus(int xp) { return xp + 10; }, lalu tulis my_xp = add_bonus(my_xp);"
  explanation: >-
    add_bonus hanya menerima salinan nilai my_xp, jadi mengubah xp tidak mengubah my_xp.
    Dengan return, fungsi mengembalikan 60, lalu hasilnya disimpan ke my_xp. Mengganti nama
    parameter tetap membuat salinan, memanggilnya dua kali tetap tidak mengubah apa-apa, dan
    printf di dalam fungsi memang menampilkan 60, tetapi my_xp di main tetap 50.
  xp: 15
