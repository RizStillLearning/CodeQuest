- id: c-l4-q08
  type: multiple_choice
  prompt: Mana penulisan fungsi yang benar untuk menerima dua int dan mengembalikan jumlahnya?
  options:
    - "int add(int a, int b) { return a + b; }"
    - "void add(int a, int b) { return a + b; }"
    - "int add(a, b) { return a + b; }"
    - "int add(int a, int b) { a + b; }"
  answer: "int add(int a, int b) { return a + b; }"
  explanation: >-
    Fungsi yang mengembalikan int harus punya return type int, setiap parameter harus ditulis
    dengan tipenya, dan hasilnya harus dikembalikan dengan return. Tanpa return, hasil
    fungsinya menjadi nilai acak.
  xp: 5

