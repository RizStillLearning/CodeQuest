- id: c-l4-q01
  type: multiple_choice
  prompt: Apa arti kedua kata void pada void greet(void)?
  options:
    - "Fungsi ini tidak mengembalikan nilai dan tidak punya parameter"
    - "Fungsi ini kosong dan tidak bisa dipanggil"
    - "Fungsi ini mengembalikan 0 dan punya satu parameter"
    - "Fungsi ini hanya bisa dipanggil sekali"
  answer: "Fungsi ini tidak mengembalikan nilai dan tidak punya parameter"
  explanation: >-
    void yang pertama adalah return type: tidak ada nilai yang dikembalikan. (void) di dalam
    tanda kurung berarti fungsi ini tidak menerima parameter.
  xp: 5

- id: c-l4-q02
  type: predict_output
  prompt: Apa output dari kode ini?
  code: |
    void greet(void) {
        printf("Halo\n");
    }

    int main(void) {
        printf("A\n");
        greet();
        greet();
        printf("B\n");
        return 0;
    }
  answer: |-
    A
    Halo
    Halo
    B
  explanation: >-
    Program dimulai dari main. C menampilkan A, lalu menjalankan isi greet() dua kali,
    lalu menampilkan B.
  xp: 10

- id: c-l4-q03
