- id: c-l4-q05
  type: multiple_choice
  prompt: Mengapa ada baris void greet(void); di atas main pada kode ini?
  code: |
    void greet(void);

    int main(void) {
        greet();
        return 0;
    }

    void greet(void) {
        printf("Halo!\n");
    }
  options:
    - "Agar compiler sudah mengenal greet saat main memanggilnya"
    - "Agar greet dijalankan dua kali"
    - "Agar greet dijalankan sebelum main"
    - "Baris itu tidak berguna dan bisa dihapus tanpa masalah"
  answer: "Agar compiler sudah mengenal greet saat main memanggilnya"
  explanation: >-
    Baris itu adalah deklarasi (prototype). C membaca dari atas ke bawah, jadi tanpa deklarasi,
    compiler belum mengenal greet saat main memanggilnya. Program tetap dimulai dari main.
  xp: 5

- id: c-l4-q06
