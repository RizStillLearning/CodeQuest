- id: c-l3-q10
  type: case_study
  scenario: |-
    Rina menulis program yang membaca skor kuis, lalu menampilkannya. Saat ia mengetik 85
    dan menekan Enter, programnya langsung crash dan berhenti.
  code: |
    int score = 0;
    printf("Skor: ");
    scanf("%d", score);
    printf("Skormu %d\n", score);
  prompt: Bagaimana cara memperbaikinya?
  options:
    - 'Tambahkan & sebelum score di scanf: scanf("%d", &score);'
    - "Ganti %d menjadi %s di scanf"
    - "Ganti int score = 0; menjadi int score;"
    - 'Tambahkan & di printf, bukan di scanf: printf("Skormu %d\n", &score);'
  answer: 'Tambahkan & sebelum score di scanf: scanf("%d", &score);'
  explanation: >-
    Tanpa &, scanf menerima nilai score (0), bukan alamatnya, lalu mencoba menyimpan 85 ke
    alamat yang salah, sehingga program crash. printf tidak memerlukan &, karena printf hanya
    membaca nilainya. %s untuk teks, dan menghapus nilai awal tidak memperbaiki apa-apa.
  xp: 15
