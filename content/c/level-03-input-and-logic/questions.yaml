- id: c-l3-q01
  type: multiple_choice
  prompt: Mengapa scanf("%d", &age); memakai tanda & sebelum age?
  options:
    - "Agar scanf tahu di mana nilainya harus disimpan"
    - "Agar angkanya menjadi positif"
    - "Untuk menggabungkan dua variabel"
    - "Tanda & tidak punya arti, hanya kebiasaan"
  answer: "Agar scanf tahu di mana nilainya harus disimpan"
  explanation: >-
    &age adalah alamat variabel age. scanf memakai alamat itu untuk menyimpan angka yang
    diketik pengguna ke dalam age.
  xp: 5

- id: c-l3-q02
  type: predict_output
  prompt: Jika pengguna mengetik 7, apa output dari kode ini?
  input: "7"
  code: |
    int number = 0;
    scanf("%d", &number);
    printf("%d\n", number * 2);
  answer: "14"
  explanation: >-
    scanf menyimpan angka 7 ke dalam number, jadi number * 2 = 14.
