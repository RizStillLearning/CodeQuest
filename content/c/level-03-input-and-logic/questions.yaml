- id: c-l3-q04
  type: predict_output
  prompt: Apa output dari kode ini?
  code: |
    int score = 90;
    int finished = 0;
    if (finished) {
        if (score >= 80) {
            printf("A\n");
        } else {
            printf("B\n");
        }
    } else {
        printf("Belum selesai\n");
    }
  answer: "Belum selesai"
  explanation: >-
    finished bernilai 0, jadi if bagian luar bernilai salah. if bagian dalam tidak pernah
    diperiksa, walaupun skornya 90, dan else bagian luar dijalankan.
  xp: 10

- id: c-l3-q05
  type: multiple_choice
  prompt: Berapa kali printf di dalam perulangan ini dijalankan?
  code: |
    for (int i = 0; i < 3; i++) {
        for (int j = 0; j < 4; j++) {
            printf("*\n");
        }
    }
  options:
    - "3 kali"
    - "4 kali"
    - "7 kali"
    - "12 kali"
  answer: "12 kali"
  explanation: >-
    Perulangan luar berjalan 3 kali. Di setiap putarannya, perulangan dalam berjalan 4 kali.
    Jadi totalnya 3 × 4 = 12 kali.
  xp: 5

- id: c-l3-q06
  type: predict_output
  prompt: Apa output dari kode ini?
  code: |
    int i = 1;
    while (1) {
        if (i > 3) {
            break;
        }
        printf("%d\n", i);
        i++;
    }
  answer: |-
    1
    2
    3
  explanation: >-
    while (1) berulang terus. Setiap putaran menampilkan i lalu menambahnya. Saat i menjadi 4,
    kondisi i > 3 benar dan break menghentikan perulangan.
  xp: 10

- id: c-l3-q07
  type: predict_output
  prompt: Apa output dari kode ini?
  code: |
    for (int i = 1; i <= 5; i++) {
        if (i == 2 || i == 4) {
            continue;
        }
        printf("%d\n", i);
    }
  answer: |-
    1
    3
    5
  explanation: >-
    Saat i bernilai 2 atau 4, continue melompati printf dan lanjut ke putaran berikutnya.
    Jadi yang ditampilkan 1, 3, dan 5.
  xp: 10

- id: c-l3-q08
  type: multiple_choice
  prompt: Apa yang dilakukan continue di dalam perulangan?
  options:
    - "Melompati sisa putaran ini, lalu lanjut ke putaran berikutnya"
    - "Menghentikan perulangan sepenuhnya"
    - "Mengulang putaran yang sama sekali lagi"
    - "Menghentikan seluruh program"
  answer: "Melompati sisa putaran ini, lalu lanjut ke putaran berikutnya"
  explanation: >-
    continue tidak menghentikan perulangan. Ia hanya melewati sisa kode di putaran ini.
    Yang menghentikan perulangan adalah break.
  xp: 5

