  prompt: Berapa kali printf di dalam perulangan ini dijalankan?
  code: |
    for (int i = 0; i < 4; i++) {
        printf("Hai\n");
    }
  options:
    - "3 kali"
    - "4 kali"
    - "5 kali"
    - "Tidak pernah"
  answer: "4 kali"
