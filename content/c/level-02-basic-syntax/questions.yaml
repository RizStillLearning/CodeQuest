- id: c-l2-q08
  type: multiple_choice
  prompt: Jika xp bernilai 50, kondisi mana yang benar?
  options:
    - "xp > 40 && xp < 60"
    - "xp > 60 || xp < 40"
    - "!(xp == 50)"
    - "xp == 40"
  answer: "xp > 40 && xp < 60"
  explanation: >-
    50 lebih besar dari 40 dan lebih kecil dari 60, jadi kedua kondisi benar dan && bernilai
    benar. Pada opsi kedua, kedua kondisinya salah. Pada opsi ketiga, xp == 50 benar, lalu
    ! membaliknya menjadi salah.
  xp: 5

