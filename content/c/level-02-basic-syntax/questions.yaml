- id: c-l2-q03
  type: multiple_choice
  prompt: Apa arti xp++; di C?
  options:
    - "Menambah xp sebanyak 1"
    - "Menambah xp sebanyak 2"
    - "Mengalikan xp dengan 2"
    - "Menampilkan nilai xp"
  answer: "Menambah xp sebanyak 1"
  explanation: >-
    xp++; adalah cara singkat menulis xp = xp + 1;. Kebalikannya, xp--; mengurangi xp sebanyak 1.
  xp: 5

