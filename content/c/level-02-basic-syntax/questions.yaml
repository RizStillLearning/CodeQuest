- id: c-l2-q10
  type: case_study
  scenario: |-
    Rina ingin menampilkan Sempurna! hanya jika skor kuisnya tepat 100.
    Skornya hanya 50, tetapi programnya tetap menampilkan Sempurna!
  code: |
    int score = 50;
    if (score = 100) {
        printf("Sempurna!\n");
    }
  prompt: Apa penyebabnya?
  options:
    - "= menyimpan 100 ke score, jadi kondisinya selalu benar. Seharusnya memakai =="
    - "printf tidak boleh dipakai di dalam if"
    - "Kondisi if seharusnya ditulis di dalam kurung kurawal { }"
    - "Angka 100 terlalu besar untuk disimpan di int"
  answer: "= menyimpan 100 ke score, jadi kondisinya selalu benar. Seharusnya memakai =="
  explanation: >-
    score = 100 tidak membandingkan, tetapi menyimpan 100 ke score. Di C, angka selain 0
    dianggap benar, jadi isi if selalu dijalankan. Dengan if (score == 100), kode ini tidak
    menampilkan apa-apa karena 50 tidak sama dengan 100.
  xp: 15
